services:
  sumirebot:
    build: .
    container_name: sumirebot
    restart: unless-stopped
    depends_on:
      - lavalink
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./database:/app/database
      - ./logs:/app/logs
    networks:
      - sumirebot-network

  lavalink:
    build: ./lavalink
    container_name: lavalink
    restart: unless-stopped
    volumes:
      - ./lavalink/Lavalink.jar:/opt/lavalink/Lavalink.jar:ro
      - ./lavalink/application.yml:/opt/lavalink/application.yml:ro
      - ./lavalink/plugins:/opt/lavalink/plugins:ro
    expose:
      - "2333"
    networks:
      - sumirebot-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2333/version"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

networks:
  sumirebot-network:
    driver: bridge
